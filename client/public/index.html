<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d1a" />

    <title>Pass the Aux 🎵</title>
    <meta
      name="description"
      content="Start a party, scan the QR, add songs and vote on what plays next. Everyone gets the aux."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link preview (WhatsApp, Telegram, Facebook, LinkedIn).
         REPLACE https://YOUR-DOMAIN.com with your real site address after deploying. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pass the Aux" />
    <meta property="og:title" content="Pass the Aux 🎵" />
    <meta
      property="og:description"
      content="Scan the QR, add songs and vote on what plays next. Everyone gets the aux."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pass the Aux 🎵" />
    <meta
      name="twitter:description"
      content="Scan the QR, add songs and vote on what plays next."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to use Pass the Aux.</noscript>
    <div id="root"></div>
  </body>
</html>
