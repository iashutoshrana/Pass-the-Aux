<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" fill="none">
  <defs>
    
    <linearGradient id="cableGrad" x1="920" y1="180" x2="1120" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#e879f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1" />
    </linearGradient>

    
    <linearGradient id="waveGrad" x1="0" y1="400" x2="1440" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#d946ef" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <path d="M0 390 Q 180 310, 360 390 T 720 390 T 1080 390 T 1440 390" stroke="url(#waveGrad)" stroke-width="2" />
  <path d="M0 415 Q 200 485, 400 415 T 800 415 T 1200 415 T 1440 415" stroke="url(#waveGrad)" stroke-width="1.5" />

  
  <path d="M 935 205
       C 1090 215, 1140 375, 975 425
       C 810 475, 635 390, 645 510
       C 655 620, 860 515, 1035 615" stroke="#a855f7" stroke-width="14" stroke-linecap="round" opacity="0.25" filter="url(#softGlow)" />

  
  <path d="M 935 205
       C 1090 215, 1140 375, 975 425
       C 810 475, 635 390, 645 510
       C 655 620, 860 515, 1035 615" stroke="url(#cableGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />

  
  <path d="M 935 205
       C 1090 215, 1140 375, 975 425
       C 810 475, 635 390, 645 510
       C 655 620, 860 515, 1035 615" stroke="#f5d0fe" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  
  <g transform="translate(1035, 615) rotate(22)" filter="url(#neonGlow)">
    
    <rect x="0" y="-6" width="16" height="12" rx="3" fill="#581c87" stroke="#d8b4fe" stroke-width="1" />
    
    <rect x="16" y="-9" width="38" height="18" rx="4" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5" />
    
    <line x1="25" y1="-9" x2="25" y2="9" stroke="#e879f9" stroke-width="2" />
    <line x1="31" y1="-9" x2="31" y2="9" stroke="#e879f9" stroke-width="2" />
    
    <rect x="54" y="-6" width="8" height="12" rx="1" fill="#a855f7" />
    
    <rect x="62" y="-3.5" width="34" height="7" fill="url(#metalGrad)" />
    
    <rect x="72" y="-3.5" width="2.5" height="7" fill="#0f0720" />
    <rect x="83" y="-3.5" width="2.5" height="7" fill="#0f0720" />
    
    <path d="M 96 -3.5 L 102 -2 Q 105 0, 102 2 L 96 3.5 Z" fill="#f3e8ff" />
  </g>

  
  <g transform="translate(1155, 655)" stroke="#d946ef" stroke-linecap="round" filter="url(#neonGlow)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke-width="2.5" opacity="0.5" />
    <line x1="10" y1="-16" x2="10" y2="16" stroke-width="2.5" opacity="0.8" />
    <line x1="20" y1="-26" x2="20" y2="26" stroke-width="2.5" opacity="1" />
    <line x1="30" y1="-14" x2="30" y2="14" stroke-width="2.5" opacity="0.85" />
    <line x1="40" y1="-22" x2="40" y2="22" stroke-width="2.5" opacity="0.9" />
    <line x1="50" y1="-10" x2="50" y2="10" stroke-width="2.5" opacity="0.6" />
    <line x1="60" y1="-4" x2="60" y2="4" stroke-width="2.5" opacity="0.3" />
  </g>
</svg>